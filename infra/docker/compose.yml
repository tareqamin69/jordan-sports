# Local development infrastructure only (docs/architecture.md §U, §V).
# Applications run on the host with `pnpm dev`. Ports are bound to localhost only.
name: jordan-sports

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: jordan_sports
      POSTGRES_PASSWORD: jordan_sports
      POSTGRES_DB: jordan_sports
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jordan_sports -d jordan_sports']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
