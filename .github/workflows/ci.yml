name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: jordan_sports
          POSTGRES_PASSWORD: jordan_sports
          POSTGRES_DB: jordan_sports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jordan_sports -d jordan_sports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # CI-only credentials for the throwaway service container above.
      DATABASE_URL: postgres://jordan_sports:jordan_sports@127.0.0.1:5432/jordan_sports
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Repository checks (RTL, sport-agnostic core)
        run: pnpm check:repo

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright browser
        run: pnpm --filter @jordan-sports/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
