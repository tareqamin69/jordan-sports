# Checks a running staging server from the public internet (manual trigger). Waits until the
# site answers, then runs the same checks as the staging smoke test and prints deployment logs.
name: Staging probe

on:
  workflow_dispatch:
    inputs:
      ip:
        description: Public IPv4 of the staging server
        required: true
      wait_minutes:
        description: How long to wait for the site
        default: '40'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the site and check it
        env:
          IP: ${{ inputs.ip }}
          WAIT: ${{ inputs.wait_minutes }}
        run: |
          set -u
          HOST="${IP//./-}.sslip.io"
          WEB="https://$HOST"
          ADMIN="https://admin.$HOST"
          echo "web: $WEB"; echo "admin: $ADMIN"
          deadline=$(( $(date +%s) + WAIT * 60 ))
          ready=no
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /tmp/home.html -w '%{http_code}' --max-time 20 "$WEB/ar" || true)
            if [ "$code" = "200" ] && grep -q 'lang="ar"' /tmp/home.html && ! grep -q 'preparing\|بتجهّز' /tmp/home.html; then ready=yes; break; fi
            echo "$(date -u +%T) not ready yet (HTTP $code)"
            sleep 30
          done
          echo "---- bootstrap log (tail) ----"
          curl -s --max-time 20 "$WEB/_staging/bootstrap.log" | tail -n 40 || true
          echo "---- update log (tail) ----"
          curl -s --max-time 20 "$WEB/_staging/update.log" | tail -n 20 || true
          if [ "$ready" != yes ]; then echo "RESULT: NOT READY"; exit 1; fi
          fail=0
          check() { if eval "$2"; then echo "OK   $1"; else echo "FAIL $1"; fail=1; fi; }
          check "home page (Arabic)" "curl -fsS $WEB/ar | grep -q 'lang=\"ar\"'"
          check "API ready" "curl -fsS $WEB/api/readyz | grep -q '\"ok\"'"
          check "demo venues" "curl -fsS '$WEB/api/v1/venues?limit=10' | grep -q demo-padel-club"
          check "venue page" "curl -fsS $WEB/ar/venues/demo-padel-club | grep -q demo-padel-club"
          check "venue photo" "curl -fsS '$WEB/api/v1/venues/demo-padel-club' | python3 -c 'import json,sys,urllib.request; u=json.load(sys.stdin)[\"media\"][0][\"url\"]; print(u)' | xargs -I{} curl -fsS -o /dev/null $WEB/api{}"
          check "availability tomorrow" "curl -fsS \"$WEB/api/v1/venues/demo-padel-club/availability?date=\$(TZ=Asia/Amman date -d tomorrow +%F)\" | grep -q '\"available\":true'"
          check "sign-in code shown (staging)" "curl -fsS -H 'Origin: $WEB' -H 'content-type: application/json' -d '{\"phone\":\"0790000009\"}' $WEB/api/v1/auth/otp/request >/dev/null && curl -fsS '$WEB/api/v1/dev/otp?phone=0790000009' | grep -q code"
          check "admin sign-in page" "curl -fsS $ADMIN/ar/sign-in | grep -q 'lang=\"ar\"'"
          check "https certificate" "curl -fsS -o /dev/null $WEB/robots.txt"
          if [ "$fail" = 0 ]; then echo "RESULT: READY"; else echo "RESULT: PARTLY BROKEN"; exit 1; fi
